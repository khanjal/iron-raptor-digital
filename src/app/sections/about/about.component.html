<section id="about" class="section">
  <div class="container-custom grid gap-14 lg:grid-cols-2 lg:items-center">

    <div>
      <p class="eyebrow">About us</p>
      <h2 class="section-title mt-4">{{ config.about.heading }}</h2>
      <div class="mt-6 space-y-5">
        @for (para of config.about.paragraphs; track $index) {
          <p class="text-lg leading-relaxed text-ink-soft">{{ para }}</p>
        }
      </div>
      <p class="mt-8 inline-flex items-center gap-2 text-sm text-ink-muted">
        <app-icon name="pin" class="h-4 w-4" />
        {{ config.business.location }}
      </p>
    </div>

    <dl class="grid gap-4 sm:grid-cols-3 lg:grid-cols-1">
      @for (hl of config.about.highlights; track hl.label) {
        <div class="card flex flex-col gap-1 lg:flex-row lg:items-baseline lg:justify-between">
          <dt class="order-2 text-sm text-ink-soft lg:order-1">{{ hl.label }}</dt>
          <dd class="order-1 text-2xl font-semibold tracking-tight lg:order-2">{{ hl.value }}</dd>
        </div>
      }
    </dl>

  </div>
</section>
