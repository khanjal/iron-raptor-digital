<section id="hero" class="relative overflow-hidden border-b border-line pt-32 pb-20 md:pt-40 md:pb-28">

  <!-- Faint engineering grid, faded toward the edges -->
  <div class="hero-grid pointer-events-none absolute inset-0" aria-hidden="true"></div>

  <div class="container-custom relative grid items-center gap-14 lg:grid-cols-[1fr_1.1fr] xl:grid-cols-[1.1fr_1fr]">

    <div class="animate-fade-up">
      <p class="eyebrow">
        <span class="h-1.5 w-1.5 rounded-full bg-accent"></span>
        {{ config.hero.eyebrow }}
      </p>

      <h1 class="mt-6 text-display-md md:text-display-lg">
        {{ config.hero.headline }}
      </h1>

      <p class="mt-6 max-w-xl text-lg leading-relaxed text-ink-soft">
        {{ config.hero.subheadline }}
      </p>

      <div class="mt-10 flex flex-col gap-3 sm:flex-row">
        <a [href]="config.hero.primaryCta.url" target="_blank" rel="noopener noreferrer" class="btn-primary">
          {{ config.hero.primaryCta.label }}
          <app-icon name="arrow" class="h-4 w-4" />
        </a>
        <a [routerLink]="config.hero.secondaryCta.path" class="btn-secondary">
          {{ config.hero.secondaryCta.label }}
        </a>
      </div>

      <dl class="mt-12 flex flex-wrap gap-x-10 gap-y-4 text-sm">
        <div>
          <dt class="text-ink-muted">Founded</dt>
          <dd class="mt-1 font-semibold">{{ config.business.founded }}</dd>
        </div>
        <div>
          <dt class="text-ink-muted">Based in</dt>
          <dd class="mt-1 font-semibold">{{ config.business.location }}</dd>
        </div>
        <div>
          <dt class="text-ink-muted">Focus</dt>
          <dd class="mt-1 font-semibold">.NET · Angular · AWS</dd>
        </div>
      </dl>
    </div>

    <!-- Code window: a real excerpt from our projects, picked per page load -->
    <div class="animate-fade-up [animation-delay:150ms] hidden min-w-0 md:block">
      <div class="overflow-hidden rounded-xl border border-line bg-surface shadow-lift">
        <div class="flex items-center gap-2 border-b border-line bg-surface-2 px-4 py-3">
          <span class="dot-close h-3 w-3 rounded-full"></span>
          <span class="dot-min h-3 w-3 rounded-full"></span>
          <span class="dot-max h-3 w-3 rounded-full"></span>
          <span class="ml-3 font-mono text-xs text-ink-muted">{{ snippet.file }}</span>
        </div>
        <pre class="min-h-[28rem] overflow-x-auto p-5 font-mono text-[12px] leading-6 xl:text-[12.5px] text-ink-soft"><code [innerHTML]="code"></code></pre>
      </div>
    </div>

  </div>
</section>
